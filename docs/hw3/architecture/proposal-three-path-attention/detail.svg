<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
<title>What repeats, what joins, and what dropout does</title>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#526174"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="50" y="55" font-size="44" fill="#223047" text-anchor="start" font-weight="700">What repeats, what joins, and what dropout does</text>
<text x="50" y="105" font-size="28" fill="#223047" text-anchor="start">Implemented architecture · schematic teaching examples, not measured activations</text>
<text x="50" y="185" font-size="36" fill="#223047" text-anchor="start" font-weight="700">A · One residual block · repeated structure ×4 per encoder</text>
<rect x="50" y="290" width="180" height="100" rx="10" fill="#e5eef9" stroke="#526174" stroke-width="2"/>
<text x="140.0" y="331.0" font-size="32" fill="#223047" text-anchor="middle" font-weight="700">Input</text>
<text x="140.0" y="369.0" font-size="32" fill="#223047" text-anchor="middle">[49, 32]</text>
<rect x="290" y="290" width="190" height="100" rx="10" fill="#e5eef9" stroke="#526174" stroke-width="2"/>
<text x="385.0" y="331.0" font-size="28" fill="#223047" text-anchor="middle" font-weight="700">Conv1D k = 3</text>
<text x="385.0" y="369.0" font-size="28" fill="#223047" text-anchor="middle">32 → 32</text>
<rect x="540" y="290" width="140" height="100" rx="10" fill="#e5eef9" stroke="#526174" stroke-width="2"/>
<text x="610.0" y="350.0" font-size="32" fill="#223047" text-anchor="middle" font-weight="700">ReLU</text>
<rect x="740" y="290" width="190" height="100" rx="10" fill="#e5eef9" stroke="#526174" stroke-width="2"/>
<text x="835.0" y="331.0" font-size="28" fill="#223047" text-anchor="middle" font-weight="700">Conv1D k = 3</text>
<text x="835.0" y="369.0" font-size="28" fill="#223047" text-anchor="middle">32 → 32</text>
<circle cx="1015" cy="340" r="27" fill="white" stroke="#526174" stroke-width="3"/>
<text x="1015" y="353" font-size="42" fill="#223047" text-anchor="middle">+</text>
<rect x="1110" y="290" width="170" height="100" rx="10" fill="#e5eef9" stroke="#526174" stroke-width="2"/>
<text x="1195.0" y="350.0" font-size="32" fill="#223047" text-anchor="middle" font-weight="700">ReLU</text>
<rect x="1350" y="290" width="190" height="100" rx="10" fill="#e5eef9" stroke="#526174" stroke-width="2"/>
<text x="1445.0" y="331.0" font-size="32" fill="#223047" text-anchor="middle" font-weight="700">Output</text>
<text x="1445.0" y="369.0" font-size="32" fill="#223047" text-anchor="middle">[49, 32]</text>
<path d="M230,340 L290,340" fill="none" stroke="#526174" stroke-width="3" marker-end="url(#a)"/>
<path d="M480,340 L540,340" fill="none" stroke="#526174" stroke-width="3" marker-end="url(#a)"/>
<path d="M680,340 L740,340" fill="none" stroke="#526174" stroke-width="3" marker-end="url(#a)"/>
<path d="M930,340 L988,340" fill="none" stroke="#526174" stroke-width="3" marker-end="url(#a)"/>
<path d="M1042,340 L1110,340" fill="none" stroke="#526174" stroke-width="3" marker-end="url(#a)"/>
<path d="M1280,340 L1350,340" fill="none" stroke="#526174" stroke-width="3" marker-end="url(#a)"/>
<path d="M255,340 L255,245 L1015,245 L1015,313" fill="none" stroke="#526174" stroke-width="3" marker-end="url(#a)"/>
<text x="635" y="230" font-size="28" fill="#223047" text-anchor="middle">Identity skip · ADD equal shapes</text>
<text x="50" y="450" font-size="30" fill="#223047" text-anchor="start">Same padding preserves 49 slots. Each block has its own weights.</text>
<text x="50" y="495" font-size="30" fill="#223047" text-anchor="start">Stem: Conv1D k=3 → 32 + ReLU. Four two-conv blocks give nine conv layers.</text>
<text x="50" y="600" font-size="36" fill="#223047" text-anchor="start" font-weight="700">B · A trace vector is a learned summary of one entire trace</text>
<text x="50" y="650" font-size="32" fill="#223047" text-anchor="start">Attention receives all T rows at once and returns T updated rows.</text>
<text x="50" y="700" font-size="30" fill="#223047" text-anchor="start">Each row represents an entire trace. Four rows illustrate four trace summaries.</text>
<text x="50" y="750" font-size="30" fill="#223047" text-anchor="start">At each locus, the distance encoder reads 49 distances to named reference loci.</text>
<text x="50" y="800" font-size="30" fill="#223047" text-anchor="start">Ordered flatten: 49 × 64 = 3,136. Dense 32 creates one trace summary.</text>
<text x="50" y="850" font-size="30" fill="#223047" text-anchor="start">XYZ uses one shared centre. Training rotates all cell traces together (SO(3)).</text>
<text x="50" y="915" font-size="36" fill="#223047" text-anchor="start" font-weight="700">C · CONCAT, ADD and DROPOUT have different jobs</text>
<rect x="40" y="965" width="470" height="230" rx="10" fill="#eee8f6" stroke="#526174" stroke-width="2"/>
<text x="275.0" y="1033.0" font-size="29" fill="#223047" text-anchor="middle" font-weight="700">CONCAT</text>
<text x="275.0" y="1071.0" font-size="29" fill="#223047" text-anchor="middle">[geometry 32 | metadata 16]</text>
<text x="275.0" y="1109.0" font-size="29" fill="#223047" text-anchor="middle">48 learned features</text>
<text x="275.0" y="1147.0" font-size="29" fill="#223047" text-anchor="middle">Keep entries side by side</text>
<rect x="565" y="965" width="450" height="230" rx="10" fill="#e5eef9" stroke="#526174" stroke-width="2"/>
<text x="790.0" y="1033.0" font-size="30" fill="#223047" text-anchor="middle" font-weight="700">ADD</text>
<text x="790.0" y="1071.0" font-size="30" fill="#223047" text-anchor="middle">[1, 2] + [3, 4]</text>
<text x="790.0" y="1109.0" font-size="30" fill="#223047" text-anchor="middle">= [4, 6]</text>
<text x="790.0" y="1147.0" font-size="30" fill="#223047" text-anchor="middle">Same width: 2 → 2</text>
<rect x="1070" y="965" width="490" height="230" rx="10" fill="#faecd9" stroke="#526174" stroke-width="2"/>
<text x="1315.0" y="1033.0" font-size="30" fill="#223047" text-anchor="middle" font-weight="700">DROPOUT</text>
<text x="1315.0" y="1071.0" font-size="30" fill="#223047" text-anchor="middle">Train: mask + rescale</text>
<text x="1315.0" y="1109.0" font-size="30" fill="#223047" text-anchor="middle">Width stays 48</text>
<text x="1315.0" y="1147.0" font-size="30" fill="#223047" text-anchor="middle">Prediction: pass through</text>
<text x="50" y="1275" font-size="30" fill="#223047" text-anchor="start">Metadata: area z-score; valid traces / 4; observed fraction; area-missing flag.</text>
<text x="50" y="1330" font-size="30" fill="#223047" text-anchor="start">Area scaling uses training cells. The other three inputs retain their defined scales.</text>
<text x="50" y="1385" font-size="30" fill="#223047" text-anchor="start">Dropout comes before Dense 32 → ReLU → Dense 3. Softmax is used for prediction.</text>
<text x="50" y="1450" font-size="30" fill="#223047" text-anchor="start">Observed-point masks accompany both CNNs. No coordinate imputation.</text>
<text x="50" y="1505" font-size="30" fill="#223047" text-anchor="start">Padded traces are excluded from attention and the mean.</text>
<text x="50" y="1570" font-size="28" fill="#223047" text-anchor="start">Geometry 32 + metadata 16 are learned features. Self-attention includes each trace itself.</text>
</g></svg>
