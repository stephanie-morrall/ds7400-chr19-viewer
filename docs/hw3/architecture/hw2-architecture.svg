<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1080" viewBox="0 0 640 1080">
<title>HW2: residual MLP</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#526174"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="320" y="35" text-anchor="middle" font-size="24" fill="#243347" font-weight="700">HW2: residual MLP</text>
<text x="320" y="64" text-anchor="middle" font-size="16" fill="#243347">Average traces first, then learn cell features.</text>
<text x="320" y="89" text-anchor="middle" font-size="16" fill="#243347">39,875 parameters · one prediction per cell</text>
<rect x="150" y="120" width="340" height="60" rx="7" fill="#f2f5f9" stroke="#8c9cae" stroke-width="1.4"/>
<text x="320.0" y="146.0" text-anchor="middle" font-size="16" fill="#243347" font-weight="700">A cell’s 1–4 traces</text>
<text x="320.0" y="166.0" text-anchor="middle" font-size="16" fill="#243347">49 ordered genomic loci</text>
<rect x="150" y="205" width="340" height="60" rx="7" fill="#e6effa" stroke="#8c9cae" stroke-width="1.4"/>
<text x="320.0" y="231.0" text-anchor="middle" font-size="16" fill="#243347" font-weight="700">Pair distances within each trace</text>
<text x="320.0" y="251.0" text-anchor="middle" font-size="16" fill="#243347">1,176 distinct pairs · µm</text>
<rect x="150" y="290" width="340" height="65" rx="7" fill="#eee9f7" stroke="#8c9cae" stroke-width="1.4"/>
<text x="320.0" y="318.5" text-anchor="middle" font-size="16" fill="#243347" font-weight="700">Average across traces</text>
<text x="320.0" y="338.5" text-anchor="middle" font-size="16" fill="#243347">1,176 numbers per cell</text>
<rect x="150" y="390" width="340" height="48" rx="7" fill="#e6effa" stroke="#8c9cae" stroke-width="1.4"/>
<text x="320.0" y="420.0" text-anchor="middle" font-size="16" fill="#243347" font-weight="700">Dense 1,176 → 32</text>
<rect x="220" y="460" width="200" height="42" rx="7" fill="#e6effa" stroke="#8c9cae" stroke-width="1.4"/>
<text x="320.0" y="487.0" text-anchor="middle" font-size="16" fill="#243347" font-weight="700">ReLU</text>
<rect x="20" y="535" width="600" height="280" rx="10" fill="#fafbfd" stroke="#c8d1dc"/>
<text x="320" y="563" text-anchor="middle" font-size="19" fill="#243347" font-weight="700">Two-layer residual correction</text>
<rect x="170" y="580" width="300" height="42" rx="7" fill="#e6effa" stroke="#8c9cae" stroke-width="1.4"/>
<text x="320.0" y="607.0" text-anchor="middle" font-size="16" fill="#243347" font-weight="700">Dense 32 → 32</text>
