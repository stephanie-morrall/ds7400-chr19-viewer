<text x="320.0" y="665.0" text-anchor="middle" font-size="16" fill="#243347" font-weight="700">ReLU</text>
<rect x="170" y="696" width="300" height="42" rx="7" fill="#e6effa" stroke="#8c9cae" stroke-width="1.4"/>
<text x="320.0" y="723.0" text-anchor="middle" font-size="16" fill="#243347" font-weight="700">Dropout p = 0.8</text>
<rect x="170" y="756" width="300" height="42" rx="7" fill="#e6effa" stroke="#8c9cae" stroke-width="1.4"/>
<text x="320.0" y="783.0" text-anchor="middle" font-size="16" fill="#243347" font-weight="700">Dense 32 → 32</text>
